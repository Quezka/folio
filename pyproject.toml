[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "folio"
dynamic = ["version"]
description = "ER and UML class diagrams for school, with SQL generation"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "quezka-ui @ git+https://github.com/Quezka/suite-kit@v0.5.1"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.gui-scripts]
folio = "folio.app:main"

[tool.setuptools.dynamic]
version = {attr = "folio.__version__"}

[tool.setuptools.packages.find]
include = ["folio*"]

[tool.setuptools.package-data]
folio = ["assets/*"]
